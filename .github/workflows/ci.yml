name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-client:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: 电脑软件
    steps:
      - uses: actions/checkout@v4
      - name: Install source-boundary scanner
        shell: powershell
        run: choco install ripgrep --no-progress -y
      - name: Verify validation script behavior
        shell: powershell
        run: ../scripts/tests/test_validation.ps1
      - name: Verify core preview source and packaging checks
        shell: powershell
        run: ../scripts/tests/test_core_build.ps1
      - name: Verify sanitized public source export
        shell: powershell
        run: ../scripts/tests/test_public_source.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 电脑软件/community_server/package-lock.json
      - run: npm ci --prefix community_server
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify Windows runtime packaging gate
        shell: powershell
        run: .\scripts\test_windows_runtime_bundle.ps1
      - name: Verify reviewed Bambu model catalog
        shell: powershell
        run: ../scripts/verify_bambu_feed.ps1 -CheckOfficialCatalog -SkipTests
      - name: Analyze Dart (errors and warnings fail the build)
        shell: powershell
        run: ../scripts/analyze_dart.ps1
      - name: Run all shared client behavior tests
        shell: powershell
        run: |
          $testArgs = @('test', '--no-pub', '--concurrency=2', '--dart-define=RUN_INVENTORY_HTTP_TESTS=true')
          if (Test-Path -LiteralPath 'core-build.json') {
            ./scripts/Test-CoreSource.ps1 -ProjectRoot .
            $testArgs += '--dart-define=SOHUN_CORE_BUILD=true'
          }
          flutter @testArgs
          if ($LASTEXITCODE -ne 0) { throw 'Flutter behavior tests failed.' }
      # Public CI deliberately stops at tests. The external installer remains
      # gated by third-party clearance and code-signing prerequisites.

  community-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 电脑软件/community_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 电脑软件/community_server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --registry=https://registry.npmjs.org --fetch-retries=2 --fetch-retry-factor=2 --fetch-retry-maxtimeout=60000 --fetch-timeout=30000

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 官网网页制作
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 官网网页制作/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check src/server.js
      - run: node --check src/public_site.js

  mobile-client:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 手机软件
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 手机软件/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --registry=https://registry.npmjs.org --fetch-retries=2 --fetch-retry-factor=2 --fetch-retry-maxtimeout=60000 --fetch-timeout=30000

  android-client:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: 电脑软件
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      # main-client owns shared Dart analysis and tests. This helper installs
      # Flutter dependencies and compiles the native Android entry point.
      - name: Build native Android target through ASCII staging
        shell: powershell
        run: |
          $buildFlags = @{ RunNativeTests = $true }
          if (Test-Path -LiteralPath 'core-build.json') { $buildFlags.Core = $true }
          .\scripts\build_android.ps1 -Configuration Debug @buildFlags
