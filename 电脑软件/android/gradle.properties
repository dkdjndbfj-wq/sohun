org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# JNI's CMake output is shared by Flutter's native-asset and Android plugin
# tasks. Serializing Gradle workers avoids AGP 9 checking libdartjni.so while
# another ABI task is still republishing it on Windows.
org.gradle.parallel=false
org.gradle.workers.max=1
# Avoid stale daemon state while AGP 9 validates native-library outputs on
# Windows; the release/CI build must use one fresh Gradle process per APK.
org.gradle.daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# This workspace is stored under a Chinese Windows path. Android Gradle's
# path check is overly conservative here; Flutter's generated sources remain
# valid and the project cannot be moved without breaking the desktop layout.
android.overridePathCheck=true
